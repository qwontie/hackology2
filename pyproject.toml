[project]
name = "hackology-team"
version = "0.1.0"
description = "Hackology II — Object Detection Challenge"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Deep learning stack — pinned to CUDA 12.4 wheels.
    # CUDA 12.4 wheels run on any driver >=525 (forward-compatible),
    # so they work on Colab T4 (driver 535) and our vast H100 (driver 560).
    "torch==2.6.0",
    "torchvision==0.21.0",
    # Ultralytics 8.3.24 is what our weights were trained against.
    "ultralytics==8.3.24",
    "ultralytics-thop==2.0.19",
    # COCO eval / submission format
    "pycocotools>=2.0.11",
    # Inference + post-processing
    "ensemble-boxes==1.0.9",
    "Pillow>=10.0,<13",
    # Note: ultralytics 8.3.24 caps numpy<2.0 on darwin; on linux it's free.
    # Let uv pick per platform — vast/Colab will get numpy 2.x, mac dev box 1.x.
    "numpy>=1.23",
    "opencv-python>=4.10,<5",
    "PyYAML>=6.0",
    "scipy>=1.13,<2",
    "requests>=2.32",
    "tqdm>=4.66",
    "psutil>=6",
    "py-cpuinfo>=9",
    # Training helpers (team's data prep + calibration)
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]

[project.scripts]
predict = "predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["predict.py"]

# --- Force torch/torchvision to come from the cu124 wheel index ---
# Without this, uv resolves torch from PyPI which on recent versions ships
# NCCL built against CUDA 13 → breaks on any driver <= CUDA 12.x.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
